<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Host portal · Luncheon Shower</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Pinyon+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .portal-head{text-align:center; padding:10px 0 10px}
  .portal-head img{width:120px; height:auto; mix-blend-mode:multiply}
  .portal-head h1{font-size:52px; margin:6px 0 0; color:var(--sage-deep); font-family:var(--script); font-weight:400}
  .tabs{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:0 0 24px}
  .tabs button{font:inherit; font-weight:600; font-size:13px; letter-spacing:.14em; text-transform:uppercase; background:transparent;
    border:1px solid var(--sage); color:var(--ink); padding:9px 14px; cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--sage-deep); border-color:var(--sage-deep); color:var(--paper)}
  .list{background:var(--paper); border:1px solid var(--sage); padding:4px 18px; text-align:left}
  .row .sub{grid-column:1/-1; font-size:17px}
  .row .meta{color:var(--ink-soft); font-size:15px}
  .empty{padding:18px 0; font-style:italic; color:var(--ink-soft); text-align:center}
  .gate li{padding:6px 0; border-top:1px solid rgba(185,138,154,.3)} .gate li:first-child{border-top:0}
  .gate{list-style:none; margin:0; padding:6px 0}
  .toolbar{display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:18px 0 0}
  .login{max-width:360px; margin:10px auto 0}
  .muted{color:var(--ink-soft); font-style:italic}
  @media print{ .garland,.tabs,.toolbar,#signout,.portal-head img{display:none !important} body{background:#fff} }
</style>
<script src="config.js"></script>
</head>
<body>
<div class="garland"><img src="art/garland.jpg" alt=""></div>
<main class="wrap">
  <header class="portal-head">
    <img src="art/monogram.jpg" alt="">
    <h1>Host portal</h1>
    <p class="muted" id="sub">Luncheon Shower for Abbey Matthews</p>
  </header>

  <form id="login" class="login card" novalidate>
    <div class="field">
      <label class="lbl" for="pass">Passcode</label>
      <input type="password" id="pass" autocomplete="current-password" autocapitalize="off" spellcheck="false">
    </div>
    <button class="btn primary wide" type="submit" id="go">Open portal</button>
    <p class="err hidden" id="err" role="alert"></p>
  </form>

  <div id="app" class="hidden">
    <section style="padding-top:20px">
      <div class="stats">
        <div class="stat"><b id="s-guests">0</b><span>guests coming</span></div>
        <div class="stat"><b id="s-yes">0</b><span>households yes</span></div>
        <div class="stat"><b id="s-no">0</b><span>declined</span></div>
        <div class="stat"><b id="s-total">0</b><span>replies</span></div>
      </div>
      <p class="muted small" id="updated" style="font-size:15px; margin:14px 0 0">Updates live as replies come in.</p>
    </section>

    <section style="padding-top:10px">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="yes" aria-selected="true">Attending</button>
        <button role="tab" data-tab="no" aria-selected="false">Declined</button>
        <button role="tab" data-tab="gate" aria-selected="false">Gate list</button>
        <button role="tab" data-tab="addr" aria-selected="false">Addresses</button>
      </div>
      <div class="list" id="list"></div>
      <div class="toolbar">
        <button class="btn" id="copy">Copy this list</button>
        <button class="btn" id="csv">Download spreadsheet</button>
        <button class="btn" id="print">Print</button>
      </div>
      <div class="toolbar"><button class="linkbtn" id="signout">Sign out</button></div>
    </section>
  </div>
</main>

<script type="module">
const FB = window.SHOWER_FIREBASE, PORTAL = window.SHOWER_PORTAL_EMAIL;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fail = m => { $("err").textContent = m; $("err").classList.remove("hidden"); };
let rows = [], tab = "yes";

if (!FB || FB.apiKey.startsWith("PASTE")) {
  fail("The portal isn't connected to Firebase yet. Paste the Firebase config into config.js.");
  $("go").disabled = true;
} else {
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  const { initializeApp } = await import(base + "firebase-app.js");
  const { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } = await import(base + "firebase-auth.js");
  const { getDatabase, ref, onValue, remove } = await import(base + "firebase-database.js");
  const app = initializeApp(FB), auth = getAuth(app), db = getDatabase(app);
  let unsub = null;

  $("login").addEventListener("submit", async e => {
    e.preventDefault(); $("err").classList.add("hidden");
    const code = $("pass").value.trim();
    if (!code) return fail("Enter the passcode.");
    $("go").disabled = true; $("go").textContent = "Opening…";
    try { await signInWithEmailAndPassword(auth, PORTAL, code); }
    catch (err) {
      fail(err.code === "auth/too-many-requests" ? "Too many tries. Wait a few minutes, then try again."
         : err.code === "auth/network-request-failed" ? "No connection. Check your internet and try again."
         : "That passcode isn't right. Check it with Jonathan.");
    } finally { $("go").disabled = false; $("go").textContent = "Open portal"; }
  });
  $("signout").onclick = () => signOut(auth);

  onAuthStateChanged(auth, user => {
    if (unsub) { unsub(); unsub = null; }
    $("login").classList.toggle("hidden", !!user);
    $("app").classList.toggle("hidden", !user);
    if (!user) return;
    unsub = onValue(ref(db, "rsvps"), snap => {
      rows = []; snap.forEach(c => { rows.push({ id: c.key, ...c.val() }); });
      rows.sort((a, b) => (b.ts || 0) - (a.ts || 0));
      $("updated").textContent = "Updated " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}) + " · updates live";
      render();
    }, err => { fail("This account can't read replies (" + err.code + ")."); signOut(auth); });
  });

  $("list").addEventListener("click", e => {
    const id = e.target.dataset && e.target.dataset.del; if (!id) return;
    const r = rows.find(x => x.id === id);
    if (confirm(`Delete the reply from ${r ? r.name : "this guest"}? This can't be undone.`)) remove(ref(db, "rsvps/" + id)).catch(err => alert(err.message));
  });
}

const guestsOf = r => r.attending ? [r.name, ...(Array.isArray(r.guests) ? r.guests : Object.values(r.guests || {}))] : [];
const when = ts => ts ? new Date(ts).toLocaleDateString([], { month:"short", day:"numeric" }) : "";

function view(){
  const yes = rows.filter(r => r.attending), no = rows.filter(r => !r.attending);
  if (tab === "gate") {
    const names = yes.flatMap(guestsOf).sort((a, b) => a.split(" ").pop().localeCompare(b.split(" ").pop()) || a.localeCompare(b));
    return { html: names.length ? `<ol class="gate">${names.map(n => `<li>${esc(n)}</li>`).join("")}</ol>` : `<p class="empty">No one has accepted yet.</p>`,
             text: names.join("\n") };
  }
  if (tab === "addr") {
    const a = rows.filter(r => r.address);
    return { html: a.length ? a.map(r => `<div class="row"><div class="name">${esc(r.name)}</div><div class="meta">${r.attending ? "Attending" : "Declined"}</div><div class="sub">${esc(r.address).replace(/\n/g,"<br>")}</div></div>`).join("") : `<p class="empty">No addresses yet.</p>`,
             text: a.map(r => r.name + "\n" + r.address).join("\n\n") };
  }
  const set = tab === "yes" ? yes : no;
  return {
    html: set.length ? set.map(r => `
      <div class="row">
        <div class="name">${esc(r.name)}${r.attending ? `<span class="tag yes">${r.count}</span>` : ""}</div>
        <div class="meta">${when(r.ts)}</div>
        ${r.attending && guestsOf(r).length > 1 ? `<div class="sub">With ${esc(guestsOf(r).slice(1).join(", "))}</div>` : ""}
        ${r.contact ? `<div class="sub meta">${esc(r.contact)}</div>` : ""}
        ${r.note ? `<div class="note">“${esc(r.note)}”</div>` : ""}
        <div style="grid-column:1/-1"><button class="linkbtn" data-del="${r.id}">Delete</button></div>
      </div>`).join("") : `<p class="empty">${tab === "yes" ? "No acceptances yet." : "No one has declined."}</p>`,
    text: set.map(r => `${r.name}${r.attending ? " (" + r.count + ")" : ""}${r.attending && guestsOf(r).length > 1 ? " with " + guestsOf(r).slice(1).join(", ") : ""}${r.contact ? " · " + r.contact : ""}`).join("\n"),
  };
}

function render(){
  const yes = rows.filter(r => r.attending);
  $("s-guests").textContent = yes.reduce((n, r) => n + (r.count || 0), 0);
  $("s-yes").textContent = yes.length;
  $("s-no").textContent = rows.length - yes.length;
  $("s-total").textContent = rows.length;
  $("list").innerHTML = view().html;
}

document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-selected", x === b));
  $("copy").textContent = "Copy this list";
  render();
});
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(view().text); $("copy").textContent = "Copied"; }
  catch (e) { $("copy").textContent = "Copy didn't work. Use Print instead."; }
};
$("print").onclick = () => window.print();
$("csv").onclick = () => {
  const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const out = ["Name,Attending,Party size,Other guests,Email or phone,Mailing address,Note,Replied"]
    .concat(rows.map(r => [q(r.name), r.attending ? "Yes" : "No", r.count || 0, q(guestsOf(r).slice(1).join("; ")), q(r.contact), q(r.address), q(r.note),
      q(r.ts ? new Date(r.ts).toLocaleString() : "")].join(","))).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], { type: "text/csv" }));
  a.download = "shower-replies.csv"; a.click();
};
</script>
</body>
</html>
